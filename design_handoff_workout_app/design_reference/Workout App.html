<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Workout App</title>
<link rel="stylesheet" href="src/app.css?v=8">
<style>
  html,body{margin:0;height:100%;background:#E9E6E0;
    font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;
    background:radial-gradient(120% 100% at 50% 0%, #EFEDE7 0%, #E2DED6 100%);}
  #fit{transform-origin:center center;}
</style>
</head>
<body>
<div id="stage"><div id="fit"><div id="mount"></div></div></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#1D9E75"/>
    <g stroke="#fff" stroke-width="5" stroke-linecap="round">
      <path d="M30 50h40"/><path d="M30 40v20M70 40v20"/><path d="M22 44v12M78 44v12"/>
    </g>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="src/seed.js?v=6"></script>
<script src="src/store.js?v=6"></script>

<script type="text/babel" src="frames/ios-frame.jsx"></script>
<script type="text/babel" src="src/ui.jsx?v=6"></script>
<script type="text/babel" src="src/history.jsx?v=6"></script>
<script type="text/babel" src="src/log.jsx?v=6"></script>
<script type="text/babel" src="src/progress.jsx?v=6"></script>
<script type="text/babel" src="src/program.jsx?v=6"></script>
<script type="text/babel" src="src/App.jsx?v=6"></script>

<script type="text/babel" data-presets="env,react">
  function mount() {
    if (!window.App || !window.IOSDevice) { setTimeout(mount, 30); return; }
    const root = ReactDOM.createRoot(document.getElementById('mount'));
    root.render(<IOSDevice><App /></IOSDevice>);
  }
  mount();

  function fit() {
    const fitEl = document.getElementById('fit');
    const W = 402, H = 874, pad = 24;
    const s = Math.min((window.innerWidth - pad) / W, (window.innerHeight - pad) / H, 1);
    fitEl.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();
</script>
</body>
</html>
